#
# IMPORTANT NOTE
#
# This chart inherits from a common library chart. You can check the default values/options here:
# https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
#

controllers:
  music-assistant-alexa-skill:
    containers:
      server:
        image:
          # -- image repository
          repository: ghcr.io/alams154/music-assistant-skill
          # -- image tag
          tag: '{{ .Chart.AppVersion }}'
          # -- image pull policy
          pullPolicy: IfNotPresent
        # -- environment variables. See more environment variables in the [music-assistant-alexa-skill documentation](https://github.com/mneveroff/music-assistant-alexa-skill/blob/HEAD/README.md).
        # @default -- See below
        env: {}
          # TZ: UTC
        ports:
          - name: http
            containerPort: 5000
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /status
            port: http
          readiness:
            enabled: true
            type: HTTP
            path: /status
            port: http
          startup:
            enabled: true
            type: HTTP
            path: /status
            port: http

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  web:
    controller: music-assistant-alexa-skill
    ports:
      http:
        port: 80
        targetPort: http

persistence:
  ask-data:
    type: emptyDir
    globalMounts:
      - path: /root/.ask
