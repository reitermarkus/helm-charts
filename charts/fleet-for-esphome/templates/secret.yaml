{{- if not (index .Values.controllers "fleet-for-esphome").containers.server.env.SERVER_TOKEN }}
{{- include "bjw-s.common.loader.init" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
type: Opaque
data:
  server_token: {{ template "fleet-for-esphome.server-token" . }}
{{- end }}
