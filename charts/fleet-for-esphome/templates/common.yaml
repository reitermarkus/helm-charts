---
{{- include "bjw-s.common.loader.init" . }}

# If there's an existing secret, reuse it, otherwise generate a new one.
{{- define "fleet-for-esphome.server-token" -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace (include "bjw-s.common.lib.chart.names.fullname" .) ) -}}
  {{- if $secret -}}
    {{-  index $secret "data" "server_token" -}}
  {{- else -}}
    {{- randAlphaNum 32 | b64enc | quote -}}
  {{- end -}}
{{- end -}}

{{- define "fleet-for-esphome.harcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{- if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{- end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "fleet-for-esphome.harcodedValues" . | fromYaml) -}}

{{- define "fleet-for-esphome.harcodedValues2" -}}
{{- $mainEnv := (index .Values.controllers "fleet-for-esphome").containers.server.env }}
controllers:
  fleet-for-esphome:
    containers:
      server:
        env:
          {{- if not $mainEnv.SERVER_TOKEN }}
          SERVER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}
                key: server_token
          {{- end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "fleet-for-esphome.harcodedValues2" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
