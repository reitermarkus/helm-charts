#
# IMPORTANT NOTE
#
# This chart inherits from a common library chart. You can check the default values/options here:
# https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
#

controllers:
  fleet-for-esphome:
    containers:
      server:
        image:
          # -- image repository
          repository: ghcr.io/weirded/esphome-dist-server
          # -- image tag
          tag: '{{ .Chart.AppVersion }}'
          # -- image pull policy
          pullPolicy: IfNotPresent
        # -- environment variables. See more environment variables in the [fleet-for-esphome documentation](https://github.com/weirded/fleet-for-esphome/blob/HEAD/README.md).
        # @default -- See below
        env: {}
          # TZ: UTC
        ports:
          - name: http
            containerPort: 8765
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
            port: http
          readiness:
            enabled: true
            type: HTTP
            path: /
            port: http
          startup:
            enabled: true
            type: HTTP
            path: /
            port: http
    pod:
      hostNetwork: true

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  web:
    controller: fleet-for-esphome
    ports:
      http:
        port: 80
        targetPort: http
